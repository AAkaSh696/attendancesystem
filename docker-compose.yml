services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: attendancesystem

    ports:
      - "5001:5001"

    env_file:
      - .env

    environment:
      REDIS_URL: redis://redis:6379
      PORT: 5001

    depends_on:
      - redis

    restart: unless-stopped

  redis:
    image: redis:7-alpine

    container_name: attendance-redis

    restart: unless-stopped