services:
  backend:
    build: .
    container_name: diwali-backend
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../diwaliapp_registration
      dockerfile: Dockerfile
    container_name: diwali-frontend
    ports:
      - "5173:5173"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: diwali-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data: